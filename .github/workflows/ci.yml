name: gate

# The repository argues that a gate which can silently pass is worse than no gate.
# This workflow runs the public verifier, full published-arm reproduction, and adversarial
# controls on a clean runner with an immutable toolchain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.13"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: self-test â€” the gate must catch a hollow anchor for the right reason
        run: sh harness/selftest.sh

      - name: the gate must reject a hollow anchor with a non-zero exit
        run: |
          set -e
          if bun run harness/src/audit_wiki.ts harness/tests/fixtures/wiki-hollow harness/tests/fixtures/target; then
            echo "FAIL: hollow fixture exited 0 â€” the gate is a shell" >&2
            exit 1
          fi
          echo "ok: hollow fixture rejected"

      - name: the gate must accept a good anchor
        run: bun run harness/src/audit_wiki.ts harness/tests/fixtures/wiki-good harness/tests/fixtures/target

      - name: published arms must reproduce their target-dependent numbers
        run: bun run harness/src/audit_arms.ts

      - name: published rates must expose numerator, denominator, and claim density
        run: bun run harness/src/check_published_arms.ts

      - name: alternative metric must preserve legacy parity and its pinned second reading
        run: |
          bun run harness/src/audit_anchor_invariant.ts \
            wiki/arm-c-generated repo-snapshot --exclude nonofficial > /tmp/arm-c-invariant.json
          bun run harness/src/audit_anchor_invariant.ts \
            wiki/arm-d-gate-driven repo-snapshot --exclude nonofficial > /tmp/arm-d-invariant.json
          bun -e '
          import { readFileSync } from "node:fs";
          const c = JSON.parse(readFileSync("/tmp/arm-c-invariant.json", "utf8"));
          const d = JSON.parse(readFileSync("/tmp/arm-d-invariant.json", "utf8"));
          const checks = [
            [c.legacy.claims, 155, "C legacy claims"],
            [c.legacy.anchored, 64, "C legacy anchored"],
            [c.invariant.pairs, 211, "C invariant pairs"],
            [c.invariant.covered, 90, "C invariant covered"],
            [d.legacy.claims, 119, "D legacy claims"],
            [d.legacy.anchored, 119, "D legacy anchored"],
            [d.invariant.pairs, 209, "D invariant pairs"],
            [d.invariant.covered, 125, "D invariant covered"],
          ];
          for (const [actual, expected, label] of checks) {
            if (actual !== expected) throw new Error(`${label}: expected ${expected}, observed ${actual}`);
          }
          console.log("ok: legacy parity and invariant second reading are pinned");
          '

      - name: arm pinning and denominator checks must be able to fail
        run: |
          set -e
          page=$(ls wiki/arm-d-gate-driven/*/*.md | head -1)
          cp "$page" /tmp/arm-page.bak
          printf '\nAn injected claim names `scripts/git_gate.py` without evidence.\n' >> "$page"
          if bun run harness/src/audit_arms.ts >/dev/null 2>&1; then
            cp /tmp/arm-page.bak "$page"
            echo "FAIL: full arm pinning did not detect an injected claim" >&2
            exit 1
          fi
          if bun run harness/src/check_published_arms.ts >/dev/null 2>&1; then
            cp /tmp/arm-page.bak "$page"
            echo "FAIL: denominator check did not detect an injected claim" >&2
            exit 1
          fi
