schema_version: agent-portfolio/v1

project:
  name: openwiki-source-anchoring
  repository: ed3c/openwiki-source-anchoring
  purpose: >-
    Test whether forcing source verification changes the usefulness and checkability
    of AI-generated code documentation.
  primary_user: maintainers and reviewers evaluating generated technical documentation
  maturity: research-artifact
  recommendation: conditional

review:
  branch: reproduction-and-adversarial-hardening
  method: yc-inspired-independent-multi-role-review
  hard_gates:
    license_present: true
    public_selftest: true
    deterministic_reproduction_bundle: true
    raw_aggregate_results_present: true
    complete_generation_reproduction: false
    exact_authorship_provenance: partial
    external_reproduction: pending

verification:
  principle: claim -> evidence -> verification command -> observed result -> limitation
  clean_room_commands:
    - sh harness/selftest.sh
    - sh reproduction/recompute.sh
  expected_exit_code: 0
  expected_final_lines:
    - selftest: PASS(valid/hollow/malformed/symlink/limits/final-retry/claim-preservation/breaker controls)
    - reproduction: PASS (protocol, fixtures, and receipts match)
  runtime:
    name: bun
    version_file: .bun-version
    version: 1.3.13
  ci_evidence:
    tested_commit: 9d2cc6e30d3c29b85294289f5c5269a6b076faf0
    gate_workflow: success
    reproducibility_workflow: success
    checks:
      - ShellCheck executable shell paths
      - parse committed JSON artifacts
      - adversarial harness self-test
      - deterministic receipt recomputation

claims:
  - id: harness-detects-valid-anchor
    claim: The deterministic fixture with valid paths and verbatim quotes passes.
    evidence:
      code: harness/src/audit_wiki.ts
      fixture: harness/tests/fixtures/wiki-good
      target: harness/tests/fixtures/target
      command: >-
        bun run harness/src/audit_wiki.ts
        harness/tests/fixtures/wiki-good
        harness/tests/fixtures/target
    expected:
      exit_code: 0
    status: verified-by-selftest-and-ci

  - id: harness-detects-hollow-anchor
    claim: A real path with a quote absent from the file is rejected for the correct reason.
    evidence:
      test: harness/selftest.sh
      fixture: harness/tests/fixtures/wiki-hollow
    expected:
      exit_code: 2
      reason: quote not found in that file
    status: verified-by-selftest-and-ci

  - id: harness-detects-malformed-anchor
    claim: A source-looking malformed anchor cannot silently disappear from the audit.
    evidence:
      test: harness/selftest.sh
      fixture: harness/tests/fixtures/wiki-malformed
    expected:
      exit_code: 2
      reason: malformed anchor
    status: verified-by-selftest-and-ci

  - id: harness-blocks-symlink-escape
    claim: An anchor resolving through a symlink outside the target root is rejected.
    evidence:
      code: harness/src/audit_wiki.ts
      test: harness/selftest.sh
    expected:
      embedded_negative_control_reason: symlink escapes target
    status: verified-by-selftest-and-ci

  - id: harness-fails-closed-on-resource-boundary
    claim: A configured input or resource boundary produces exit 3 and an incomplete receipt, never PASS.
    evidence:
      code: harness/src/audit_wiki.ts
      tests:
        - page byte limit
        - source file byte limit
        - anchor count limit
        - depth limit
        - invalid UTF-8
      command: sh harness/selftest.sh
    expected:
      exit_code: 0
      embedded_receipt:
        complete: false
        status: incomplete
    limitation: application limits do not replace host CPU, memory, disk, and process isolation
    status: verified-by-selftest-and-ci

  - id: trigger-reaudits-final-mutation
    claim: A claim fixed on the final allowed retry passes only after a fresh post-loop audit.
    evidence:
      code: harness/trigger.sh
      deterministic_driver: harness/tests/fake_driver.sh
      test: harness/selftest.sh
      receipt: audit.fixture-final-success.json
    expected:
      trigger_exit_code: 0
      final_receipt_status: passed
    status: verified-by-selftest-and-ci

  - id: trigger-records-invalid-final-mutation
    claim: An invalid anchor introduced on the final retry appears in the final unresolved receipt.
    evidence:
      code: harness/trigger.sh
      deterministic_driver: harness/tests/fake_driver.sh
      test: harness/selftest.sh
    expected:
      trigger_exit_code: 2
      reason: quote not found in that file
    status: verified-by-selftest-and-ci

  - id: tracked-claims-cannot-silently-disappear
    claim: Removing an explicit claim ID while keeping word count flat or higher is restored and rejected.
    evidence:
      code:
        - harness/src/claim_guard.ts
        - harness/trigger.sh
      test: harness/selftest.sh
      documentation: harness/CLAIM_PRESERVATION.md
    expected:
      exit_code: 2
      reason: claim-id missing without disposition
    limitation: pages without explicit claim IDs still use a coarse word-count fallback
    status: verified-by-selftest-and-ci

  - id: deterministic-bundle-recomputes
    claim: The public fixture receipts match frozen expected JSON and SHA-256 manifests.
    evidence:
      protocol: reproduction/protocol-v1.md
      provenance: reproduction/provenance.json
      command: sh reproduction/recompute.sh
    expected:
      exit_code: 0
      final_line: reproduction: PASS (protocol, fixtures, and receipts match)
    limitation: this reproduces deterministic harness behavior, not the original stochastic model experiment
    status: verified-by-selftest-and-ci

  - id: audit-is-lexical-not-semantic
    claim: The auditor proves quote presence, not that evidence entails the surrounding claim.
    evidence:
      code: harness/src/audit_wiki.ts
      documentation:
        - README.md
        - METRICS.md
        - EXPERIMENT_REVIEW.md
    status: explicitly-bounded

results:
  public_qa_run:
    denominator: 30
    repeats: 1
    arms:
      A:
        pass: 7
        pass_rate: 0.2333
      B:
        pass: 12
        pass_rate: 0.4
      Bs:
        pass: 12
        pass_rate: 0.4
      C:
        pass: 14
        pass_rate: 0.4667
      D:
        pass: null
        note: QA not measured
    interpretation: directional-only
    raw_evidence:
      - qa/
      - data/arm-comparison.json
    next_experiment:
      issue: 8
      protocol: experiments/factorial-v1/PROTOCOL.md
      status: not-run

limitations:
  - n=30 with one stochastic run and no repeated generations
  - equality of B and Bs aggregate PASS is not an equivalence result
  - B and C differ on multiple dimensions and do not isolate a gate effect
  - the original target and host pipeline are not fully public
  - exact immutable model identifiers and sampling parameters are incomplete
  - only 22 of 53 author-reported corrections were blindly adjudicated
  - the historical threshold-freezing commit is outside this public repository
  - protocol-v1 is prospective and does not retroactively preregister the original experiment
  - the claim denominator is defined by a heuristic parser
  - lexical validity is not semantic correctness
  - external maintainer and reproduction evidence is still pending

authorship:
  policy_document: AUTHORSHIP.md
  human_accountability:
    - problem selection
    - experiment design
    - interpretation and claim boundaries
    - merge decision
  agent_assisted:
    - generation and adjudication steps in the original study
    - repository review and hardening changes
    - deterministic fixture and documentation drafting
  provenance_quality: partial

collaboration:
  contributing: CONTRIBUTING.md
  security: SECURITY.md
  governance: GOVERNANCE.md
  code_of_conduct: CODE_OF_CONDUCT.md
  support: SUPPORT.md
  citation: CITATION.cff
  reproduction_report_template: reproduction/reports/TEMPLATE.md
  external_challenge: docs/EXTERNAL_REPRODUCTION_CHALLENGE.md
  follow_up_issues:
    factorial_repeated_evaluation: 8
    external_reproduction_challenge: 10
