name: Factorial infrastructure

on:
  pull_request:
    paths:
      - "experiments/factorial-v1/**"
      - ".github/workflows/factorial-infrastructure.yml"
  push:
    branches:
      - main
    paths:
      - "experiments/factorial-v1/**"
      - ".github/workflows/factorial-infrastructure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Parse experiment JSON
        run: |
          bun -e '
          import { readFileSync } from "node:fs";
          for (const path of [
            "experiments/factorial-v1/run-manifest.schema.json",
            "experiments/factorial-v1/study-config.template.json",
            "experiments/factorial-v1/planning-assumptions.example.json",
            "experiments/factorial-v1/fixtures/smoke-config.json",
            "experiments/factorial-v1/fixtures/questions.json",
            "experiments/factorial-v1/fixtures/split.json"
          ]) JSON.parse(readFileSync(path, "utf8"));
          '

      - name: Run deterministic five-cell smoke test
        run: bun run experiments/factorial-v1/smoke-test.mjs

      - name: Run planning simulation example
        run: >-
          bun run experiments/factorial-v1/plan-repeats.mjs
          experiments/factorial-v1/planning-assumptions.example.json
          --output "$RUNNER_TEMP/planning.json"
          --markdown "$RUNNER_TEMP/planning.md"
