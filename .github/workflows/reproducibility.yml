name: Reproducibility

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.13"

jobs:
  apply_bundle:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'reproduction-and-adversarial-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: reproduction-and-adversarial-hardening
          persist-credentials: true

      - name: Apply self-removing hardening bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/hardening-bundle.part-00 \
            .github/hardening-bundle.part-01 \
            .github/hardening-bundle.part-02 \
            .github/hardening-bundle.part-03 \
            .github/hardening-bundle.part-04a \
            .github/hardening-bundle.part-04b \
            .github/hardening-bundle.part-05 \
            .github/hardening-bundle.part-06 \
            .github/hardening-bundle.part-07a \
            .github/hardening-bundle.part-07b \
            | base64 --decode > /tmp/hardening.tar.gz
          tar -xzf /tmp/hardening.tar.gz
          rm .github/hardening-bundle.part-* .github/workflows/apply-hardening-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add deterministic reproduction, claim preservation, and resource limits"
          git push origin HEAD:reproduction-and-adversarial-hardening

  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Record toolchain
        run: |
          bun --version
          shellcheck --version

      - name: ShellCheck all harness scripts for errors
        run: shellcheck --severity=error harness/*.sh

      - name: ShellCheck gate paths for warnings
        run: shellcheck --severity=warning harness/selftest.sh harness/verify.sh harness/trigger.sh

      - name: Run harness self-test
        run: sh harness/selftest.sh
