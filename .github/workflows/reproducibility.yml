name: Reproducibility

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run harness self test
        run: sh harness/selftest.sh
